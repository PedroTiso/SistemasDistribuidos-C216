name: CI Frontend

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - "Makefile"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formatacao
        run: npm run format:check

      - name: Executar verificacoes do Biome
        run: npm run check

      - name: Executar testes unitarios e de integracao
        run: npm test

      - name: Gerar build
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Publicar relatorio do Playwright
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
